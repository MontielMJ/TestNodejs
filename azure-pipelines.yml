# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- main

pool:
  name: 'Default'   # o el nombre del pool donde tienes tu agente

steps:
# 1️⃣ Instalar Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Instalar Node.js 20.x'

# 2️⃣ Instalar dependencias y construir
- script: |
    npm ci
    npm run build
  displayName: 'Instalar dependencias y compilar'

- powershell: |
    Write-Host "Directorio actual: $PWD"
    Write-Host "SourcesDirectory: $(Build.SourcesDirectory)"
  displayName: 'Mostrar rutas de trabajo'

# 4️⃣ Iniciar servidor Express y validar que responde
- powershell: |
    Write-Host "Iniciando servidor Express..."
    Start-Process "node" "src/index.js"
    Write-Host "Esperando que el servidor levante..."
    Start-Sleep -Seconds 10
    try {
      $response = Invoke-WebRequest 'http://localhost:3000' -UseBasicParsing
      if ($response.StatusCode -eq 200) {
        Write-Host "✅ Servidor Express levantado correctamente"
      } else {
        Write-Error "❌ Código inesperado: $($response.StatusCode)"
        exit 1
      }
    } catch {
      Write-Error "❌ No se pudo acceder al servidor Express"
      exit 1
    }
  displayName: 'Probar servidor Express'
  workingDirectory: '$(Build.SourcesDirectory)'