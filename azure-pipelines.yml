# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- main

pool:
  name: 'Default'   # o el nombre del pool donde tienes tu agente

steps:
# 1️⃣ Instalar Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Instalar Node.js 20.x'

# 2️⃣ Instalar dependencias y construir
- script: |
    npm ci
    npm run build
  displayName: 'Instalar dependencias y compilar'

- powershell: |
    Write-Host "Directorio actual: $PWD"
    Write-Host "SourcesDirectory: $(Build.SourcesDirectory)"
  displayName: 'Mostrar rutas de trabajo'

- powershell: |
    Write-Host "=== 🔍 Diagnóstico de entorno del agente ==="
    Write-Host "Usuario actual: $env:USERNAME"
    Write-Host "Directorio actual: $PWD"
    Write-Host "Directorio raíz del agente: $env:AGENT_ROOTDIRECTORY"
    Write-Host "SourcesDirectory: $(Build.SourcesDirectory)"
    Write-Host "BinariesDirectory: $(Build.BinariesDirectory)"
    Write-Host "ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
    Write-Host "Build.Repository.Name: $(Build.Repository.Name)"
    Write-Host "Build.Repository.LocalPath: $(Build.Repository.LocalPath)"
    Write-Host "Archivos descargados en:"
    Get-ChildItem -Path "$(Build.SourcesDirectory)" -Recurse -Depth 2 | Select-Object FullName
    Write-Host "==========================================="
  displayName: '🧭 Diagnóstico de rutas y entorno'
  workingDirectory: '$(Build.SourcesDirectory)'
  
# 4️⃣ Iniciar servidor Express y validar que responde
- powershell: |
    Write-Host "=== 🚀 Iniciando servidor Express ==="
    Write-Host "Ejecutando desde: $PWD"

    # Arranca el servidor en segundo plano
    $nodePath = "$(Build.SourcesDirectory)\src\index.js"
    Write-Host "Ejecutando: node $nodePath"
    Start-Process "node.exe" $nodePath -PassThru | Out-Null

    Write-Host "⏳ Esperando 10 segundos para que el servidor levante..."
    Start-Sleep -Seconds 10

    # Verificar si el proceso node está activo
    $node = Get-Process node -ErrorAction SilentlyContinue
    if (-not $node) {
        Write-Error "❌ El proceso Node no está corriendo. Revisa si tu app tiene errores al iniciar."
        exit 1
    }

    # Intentar acceder al servidor
    Write-Host "🌐 Validando http://localhost:3000/"
    try {
        $response = Invoke-WebRequest 'http://localhost:3000/' -UseBasicParsing -TimeoutSec 10
        if ($response.StatusCode -eq 200) {
            Write-Host "✅ Servidor Express levantado correctamente"
        } else {
            Write-Error "❌ Respuesta inesperada: $($response.StatusCode)"
            exit 1
        }
    } catch {
        Write-Error "❌ No se pudo acceder al servidor Express: $($_.Exception.Message)"
        exit 1
    }

    # Detener el proceso Node
    Write-Host "🧹 Deteniendo servidor..."
    Stop-Process -Name node -Force
    Write-Host "✅ Servidor detenido correctamente."
  displayName: '🚀 Iniciar y validar servidor Express'
  workingDirectory: '$(Build.SourcesDirectory)'